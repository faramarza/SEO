{% extends "base.html" %}
{% block title %}Start Here{% endblock %}
{% block header %}🏠 Start Here{% endblock %}

{% block content %}
<div class="dn-page">
    <div id="dn-reviewed" class="dn-reviewed" style="display:none;"></div>
    <div id="dn-datastatus" class="dn-datastatus" style="display:none;"></div>
    <div id="dn-body"><p class="pb-loading">Loading your plan…</p></div>
    <div id="dn-toast" class="pb-toast"></div>
</div>

<style>
.dn-q-bar{display:flex;gap:14px;align-items:center;font-size:13px;color:var(--text-muted);margin:0 0 14px;flex-wrap:wrap;}
.dn-q-bar b{color:var(--text-primary);}
.dn-guide{border:2px solid var(--accent-blue);border-radius:14px;padding:20px;background:var(--bg-card,#fff);box-shadow:0 6px 22px rgba(37,99,235,.10);}
.dn-guide-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
.dn-now{background:var(--accent-blue);color:#fff;font-size:12px;font-weight:800;letter-spacing:.05em;padding:2px 10px;border-radius:20px;}
.dn-pos{font-size:12px;color:var(--text-muted);font-weight:600;}
.dn-tierlbl{font-size:12px;font-weight:700;}
.dn-guide-title{font-size:20px;font-weight:800;margin:4px 0 6px;line-height:1.25;}
.dn-guide-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;margin-bottom:12px;}
.dn-payoff{background:#dcfce7;color:#166534;font-weight:700;padding:2px 9px;border-radius:8px;}
.dn-where{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px;}
.dn-where b{color:#1e3a8a;}
.dn-steps2{list-style:none;padding:0;margin:0 0 14px;counter-reset:s;}
.dn-steps2 li{position:relative;padding:11px 12px 11px 40px;border-radius:8px;margin-bottom:7px;font-size:14px;line-height:1.45;}
.dn-steps2 li::before{position:absolute;left:11px;top:10px;width:20px;height:20px;border-radius:50%;text-align:center;line-height:20px;font-size:12px;font-weight:700;}
.dn-s-done{color:var(--text-muted);background:var(--bg-subtle,#f1f5f9);}
.dn-s-done::before{content:'✓';background:#16a34a;color:#fff;}
.dn-s-done .dn-stxt{text-decoration:line-through;}
.dn-s-now{background:#fffbeb;border:1px solid #fde68a;}
.dn-s-now::before{counter-increment:s;content:counter(s);background:var(--accent-blue);color:#fff;}
.dn-s-lock{color:#94a3b8;background:transparent;}
.dn-s-lock::before{counter-increment:s;content:counter(s);background:#e2e8f0;color:#94a3b8;}
.dn-step-done{margin-top:8px;display:inline-block;background:var(--accent-blue);color:#fff;border:none;border-radius:7px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;}
.dn-deliv{margin-top:8px;}
.dn-guide-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--border,rgba(0,0,0,.08));padding-top:14px;}
.dn-done-big{background:#16a34a;color:#fff;border:none;border-radius:9px;padding:11px 22px;font-size:15px;font-weight:800;cursor:pointer;}
.dn-done-big:disabled{background:#cbd5e1;cursor:not-allowed;}
.dn-skip{background:none;border:none;color:var(--text-muted);font-size:13px;cursor:pointer;text-decoration:underline;}
.dn-mini{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 12px;border-radius:7px;font-size:13px;background:var(--bg-subtle,#f8fafc);margin-bottom:6px;}
.dn-mini.lock{opacity:.55;}
.dn-mini .r{color:var(--text-muted);font-size:12px;white-space:nowrap;}
.dn-qsection{font-size:13px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 8px;cursor:pointer;}
</style>
{% endblock %}

{% block scripts %}
<script>
function esc(s){ if(s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtPath(u){ try{ const p=new URL(u).pathname; return p.length>52?'…'+p.slice(-50):p; }catch(e){ return u||''; } }

const CAT_META = {
    ctr:      { icon:'💰', label:'CTR' },
    cro:      { icon:'🛒', label:'CRO' },
    reviews:  { icon:'🌟', label:'Reviews' },
    schema:   { icon:'⭐', label:'Schema' },
    merchant: { icon:'🏷️', label:'Merchant' },
    striking: { icon:'🎯', label:'Ranking' },
    winnable: { icon:'🧲', label:'Winnable' },
    decay:    { icon:'📉', label:'Refresh' },
    orphan:   { icon:'🕸️', label:'Internal links' },
    pruning:  { icon:'✂️', label:'Prune' },
    content:  { icon:'✍️', label:'Content gap' },
    geo:      { icon:'🤖', label:'AI Citation' },
    brand:    { icon:'🏷️', label:'Brand' },
    links:    { icon:'🔗', label:'Outreach' },
    consolidation: { icon:'🧭', label:'Consolidate' },
};
const STATUS_META = {
    todo:        { txt:'In progress — auto-check scheduled', cls:'dn-badge-todo' },
    needs_tweak: { txt:'Didn\'t move yet — tweak suggested', cls:'dn-badge-tweak' },
    done:        { txt:'Done / worked ✓', cls:'dn-badge-done' },
};

let DN = null;

function dnToast(msg, err){
    const t=document.getElementById('dn-toast');
    t.textContent=msg; t.className='pb-toast show'+(err?' error':'');
    setTimeout(()=>{ t.className='pb-toast'; },3000);
}

async function loadStrategy(refresh){
    const box=document.getElementById('dn-strategy');
    if(!box) return;   // strategy brief removed from the guided view
    if(refresh) box.innerHTML='<p class="pb-loading" style="margin:0;">Re-reading your whole picture…</p>';
    try{
        const res=await fetch('/api/action-plan/strategy'+(refresh?'?refresh=1':''));
        const d=await res.json();
        if(d.pending){
            // Brief is generating in the background (LLM call) — poll a few times.
            window._stratPolls=(window._stratPolls||0)+1;
            if(window._stratPolls<=6) setTimeout(()=>loadStrategy(false), 15000);
            if(refresh) box.innerHTML='<p class="pb-loading" style="margin:0;">Re-reading your whole picture… (finishes in the background, ~1-2 min)</p>';
            else box.style.display='none';
            return;
        }
        window._stratPolls=0;
        if(d.error || !d.focus){ box.style.display='none'; return; }
        box.style.display='block';
        const moves=(d.moves||[]).map(m=>`<li>${esc(m)}</li>`).join('');
        box.innerHTML=`
            <div class="dn-strat-head">
                <span class="dn-strat-badge">🎯 Your #1 focus this month</span>
                <button class="dn-strat-refresh" onclick="loadStrategy(true)" title="Regenerate">↻</button>
            </div>
            <div class="dn-strat-focus">${esc(d.focus)}</div>
            <div class="dn-strat-why">${esc(d.why)}</div>
            ${moves?`<div class="dn-strat-label">Do this:</div><ol class="dn-strat-moves">${moves}</ol>`:''}
            ${d.expected_impact?`<div class="dn-strat-impact">📈 <strong>Expected impact:</strong> ${esc(d.expected_impact)}</div>`:''}
            ${d.skip?`<div class="dn-strat-skip">🚫 <strong>Skip for now:</strong> ${esc(d.skip)}</div>`:''}`;
    }catch(e){ box.style.display='none'; }
}

async function loadPlan(){
    try{
        const res=await fetch('/api/action-plan');
        const data=await res.json();
        DN=data;
        if(data.error){ document.getElementById('dn-body').innerHTML=`<p class="empty-state">${esc(data.error)}</p>`; return; }
        renderReviewed(data.reviewed_now||[]);
        renderDataStatus(data.data_status||{});
        renderPlan(data.plan||[], data.adopted_extra||[]);
    }catch(e){
        document.getElementById('dn-body').innerHTML=`<p class="empty-state">Failed to load: ${esc(e.message)}</p>`;
    }
}

function renderReviewed(rev){
    const box=document.getElementById('dn-reviewed');
    if(!rev.length){ box.style.display='none'; return; }
    box.style.display='block';
    box.innerHTML = `<strong>🔔 Auto-check results (today):</strong>` + rev.map(r=>{
        const icon = r.status==='improved'||r.status==='done' ? '✅' : (r.status==='worse'?'❌':'➖');
        return `<div class="dn-review-line">${icon} <strong>${esc(r.title||'')}</strong> — ${esc(r.detail||'')}${r.tweak?` <em>${esc(r.tweak)}</em>`:''}</div>`;
    }).join('');
}

function taskCard(t, off){
    const c=CAT_META[t.category]||{icon:'•',label:t.category};
    const val = t.expected_value>0 ? `$${Math.round(t.expected_value).toLocaleString()}/mo` :
                (t.reach? `${(t.reach).toLocaleString()} impr reach` : 'Foundational');
    const steps=(t.steps||[]).filter(s=>s!=null && String(s).replace(/[\s​ ]+/g,'')!=='').map(s=>{
        // Render JSON-LD-ish blocks as code.
        if(/^\s*[\[{]/.test(s)) return `<pre class="dn-code">${esc(s)}</pre>`;
        return `<li>${esc(s)}</li>`;
    }).join('');
    const reviews=(t.reviews||[]).map(rv=>{
        const icon = rv.status==='improved'||rv.status==='done'?'✅':(rv.status==='worse'?'❌':'➖');
        return `<div class="dn-review-line">${icon} <span style="color:var(--text-muted);">${esc(rv.checked_on||'')}:</span> ${esc(rv.detail||'')}${rv.tweak?` <em>${esc(rv.tweak)}</em>`:''}</div>`;
    }).join('');
    const statusBadge = t.adopted ? (()=>{ const m=STATUS_META[t.status]||STATUS_META.todo; return `<span class="dn-badge ${m.cls}">${esc(m.txt)}</span>`; })() : '';
    const domId = 'dv-' + btoa(unescape(encodeURIComponent(t.dedup_key))).replace(/[^a-zA-Z0-9]/g,'');
    const DELIVERABLE_CATS = ['ctr','content','geo','reviews','brand','striking'];
    const genBtn = DELIVERABLE_CATS.includes(t.category)
        ? `<button class="pb-task-btn pb-task-btn-alt" onclick="dnGenerate('${esc(t.dedup_key)}','${domId}',this)">✍️ Write it for me</button>` : '';
    const btns = (t.status==='done'
        ? `<button class="pb-task-btn pb-added" disabled>✓ Done</button>`
        : (t.adopted
            ? `<button class="pb-task-btn" onclick="dnComplete('${esc(t.dedup_key)}', this)">Mark done</button>`
            : `<button class="pb-task-btn" onclick="dnAdopt('${esc(t.dedup_key)}', this)">Start this →</button>`)) + genBtn;
    return `<div class="dn-card ${off?'dn-off':''}">
        <div class="dn-head">
            <div class="dn-rank">${off?'✓':(t.rank?('#'+t.rank):'—')}</div>
            <div class="dn-titlewrap">
                <div class="dn-title">${c.icon} ${esc(t.title)}</div>
                <div class="dn-sub">
                    <span class="dn-chip">${esc(c.label)}</span>
                    ${t.low_hanging?`<span class="dn-chip" style="background:#dcfce7;color:#166534;" title="Quick and easy AND it drives real sales — grab this one first">🍒 low-hanging fruit</span>`:''}
                    ${t.rank_reason?`<span class="dn-why">${esc(t.rank_reason)}</span>`:''}
                    ${t.url?`<a href="${esc(t.url)}" target="_blank" title="${esc(t.url)}">${esc(fmtPath(t.url))}</a><span class="lp-slot" data-lp-url="${esc(t.url)}"></span>`:''}
                </div>
            </div>
            <div class="dn-metrics">
                <div class="dn-metric"><span class="dn-metric-val">${val}</span><span class="dn-metric-lbl">payoff</span></div>
                <div class="dn-metric"><span class="dn-metric-val">${esc((t.effort||'').split(' ')[0])}</span><span class="dn-metric-lbl">effort</span></div>
                <div class="dn-metric"><span class="dn-metric-val">${esc(t.time_to_impact_label||'')}</span><span class="dn-metric-lbl">to show results</span></div>
            </div>
        </div>
        <div class="dn-benefit">🎁 <strong>Benefit:</strong> ${esc(t.benefit)}</div>
        ${t.yield_note?`<div class="dn-when" style="color:#b45309;">⚖️ ${esc(t.yield_note)}</div>`:''}
        ${steps?`<details ${off?'':'open'}><summary>Exact steps</summary><ol class="dn-steps">${steps}</ol></details>`:''}
        ${statusBadge}
        ${(t.adopted && t.auto_review!==false && t.review_date && t.status!=='done') ? `<div class="dn-when">⏳ Auto-check on <strong>${esc(t.review_date)}</strong> — the tool will re-measure and tell you if it worked.</div>`:''}
        ${(t.adopted && t.auto_review===false && t.status!=='done') ? `<div class="dn-when">✋ Self-report — mark this done once you've actioned it (the tool can't auto-measure removals).</div>`:''}
        ${reviews?`<div class="dn-reviews">${reviews}</div>`:''}
        <div class="dn-deliverable" id="${domId}"></div>
        <div class="dn-actions">${btns}</div>
    </div>`;
}

function renderDataStatus(ds){
    const el=document.getElementById('dn-datastatus');
    if(!ds || !ds.total_pages){ el.style.display='none'; return; }
    const pill=(label,val,ok)=>`<span class="dn-dpill ${ok?'dn-dpill-ok':'dn-dpill-off'}">${esc(label)}: <strong>${esc(val)}</strong></span>`;
    const crawlOk = ds.crawled_pages>0;
    let chips = pill('Crawled', `${(ds.crawled_pages||0).toLocaleString()}/${(ds.total_pages||0).toLocaleString()} pages`, crawlOk)
        + pill('GA4', ds.has_ga4?'connected':'missing', ds.has_ga4)
        + pill('GSC', ds.has_gsc?'connected':'missing', ds.has_gsc)
        + pill('Ahrefs kws', (ds.ahrefs_keywords||0).toLocaleString(), (ds.ahrefs_keywords||0)>0)
        + pill('Data age', ds.eval_age_days==null?'—':`${ds.eval_age_days}d`, (ds.eval_age_days!=null && ds.eval_age_days<=10));
    let tips=(ds.tips||[]).map(([sev,msg])=>{
        const ic=sev==='critical'?'⛔':(sev==='warn'?'⚠️':'💡');
        return `<div class="dn-tip dn-tip-${esc(sev)}">${ic} ${esc(msg)}</div>`;
    }).join('');
    el.style.display='block';
    el.innerHTML=`<div class="dn-dpills">${chips}</div>${tips}`;
}

const CAT_LABEL = { ctr:'Rewrite titles', schema:'Add schema', merchant:'Fix product feeds', orphan:'Add internal links', pruning:'Prune/merge pages' };

// ── Guided queue state (client-side) ────────────────────────────────────────
let FOCUS_OVERRIDE = null;              // key the user chose to jump to
const DN_ADOPTED_LOCAL = new Set();     // optimistically-adopted keys (instant next)
const DN_DELIV = {};                    // cached paste-ready deliverables by key
function dnKeyId(k){ return 'k'+btoa(unescape(encodeURIComponent(k))).replace(/[^a-zA-Z0-9]/g,''); }
function dnLS(k,def){ try{ const v=localStorage.getItem(k); return v==null?def:v; }catch(e){ return def; } }
function dnSetLS(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function dnSteps(t){ return (t.steps||[]).filter(s=>s!=null && String(s).replace(/[\s​]+/g,'')!==''); }
function dnStepDoneCount(k){ return parseInt(dnLS('dnstep:'+k,'0'),10)||0; }
function dnSkipSet(){ try{ return new Set(JSON.parse(dnLS('dnskip','[]'))); }catch(e){ return new Set(); } }
function dnSkipSave(s){ dnSetLS('dnskip', JSON.stringify([...s])); }

// Where to actually DO each kind of task — so the guide is self-contained.
const DN_WHERE = {
  ctr:   'In <b>Magento → Catalog → Products</b> → find this page → open <b>Search Engine Optimization</b> → paste into <b>Meta Title</b> / <b>Meta Description</b> → <b>Save</b>, then <b>System → Cache Management → Flush Magento Cache</b>.',
  brand: 'In <b>Magento → Catalog → Products</b> → this page → <b>Search Engine Optimization</b> → update <b>Meta Title</b> / <b>Meta Description</b> → Save → flush cache.',
  striking: 'In <b>Magento</b>, open each <b>source page listed in the steps</b> → edit its content → add a normal text link using the exact anchor shown → Save.',
  winnable: 'In <b>Magento</b>, open each <b>source page listed in the steps</b> → edit its content → add a text link with the exact anchor shown → Save.',
  orphan: 'In <b>Magento</b>, open each related page listed → add a contextual text link to this page with the anchor shown → Save.',
  content: 'In <b>Magento → Content → Pages</b> (or the product / blog page) → paste the draft below → set the title & URL → <b>Save & publish</b>.',
  geo:   'In <b>Magento</b>, edit this page → paste the FAQ / schema block below into the content (or Schema field) → Save.',
  schema:'In <b>Magento</b>, edit this page → paste the JSON-LD below into the page content → Save → test in Google Rich Results.',
  merchant:'In <b>Magento</b>, add the product fields listed below → Save → then confirm in <b>Google Merchant Center</b>.',
  links: 'In <b>your email</b>: send each draft below to the prospect (Governor writes them — you review and hit Send). Track replies.',
  consolidation:'In <b>Magento → Marketing → SEO &amp; Search → URL Rewrites</b> → add a <b>301 redirect</b> from the old URL to the winning page shown.',
  pruning:'In <b>Magento</b>, for each page listed: set it to <b>noindex</b> (or remove it) as the steps describe.',
  reviews:'On your <b>review platform / product pages</b>: turn on review requests and follow the steps.',
  cro:   'On the page itself: apply the on-page change described in the steps → Save.',
  decay: 'In <b>Magento</b>, refresh this page’s content per the steps → Save → then <b>Google Search Console → URL Inspection → Request Indexing</b>.',
};
const DN_AUTODELIV = new Set(['ctr','brand','geo','schema','merchant','decay','cro','reviews']);

function tierLabel(t){
    const x=t.tier||(t.minor?'nice':'quick');
    if(x==='critical') return '<span class="dn-tierlbl" style="color:#dc2626;">🔴 biggest sales impact</span>';
    if(x==='quick')    return '<span class="dn-tierlbl" style="color:#16a34a;">🟢 solid sales win</span>';
    return '<span class="dn-tierlbl" style="color:#64748b;">low priority</span>';
}
function payoffChip(t){
    const v = t.expected_value>0 ? `~$${Math.round(t.expected_value).toLocaleString()}/mo if it works`
            : (t.reach? `${(t.reach).toLocaleString()} impressions in play` : 'foundational');
    return `<span class="dn-payoff">💰 ${esc(v)}</span>`;
}

function renderPlan(plan, extra){
    const body=document.getElementById('dn-body');
    const skip = dnSkipSet();
    const isOpen = t => !t.adopted && !DN_ADOPTED_LOCAL.has(t.dedup_key);
    const openAll = plan.filter(isOpen);
    const open = openAll.filter(t=>!skip.has(t.dedup_key));
    const skipped = openAll.filter(t=>skip.has(t.dedup_key));
    const extraOpen = (extra||[]).filter(t=>t.status!=='done');
    const extraDone = (extra||[]).filter(t=>t.status==='done');
    const measuring = plan.filter(t=>(t.adopted||DN_ADOPTED_LOCAL.has(t.dedup_key)) && t.status!=='done').concat(extraOpen);

    if(!openAll.length && !measuring.length && !extraDone.length){
        body.innerHTML='<p class="empty-state">Nothing queued right now — run an evaluation (with crawl) to refill your list. 🎉</p>';
        return;
    }

    // Focus = the one task you're on: your chosen jump, else the top by sales.
    let focus = FOCUS_OVERRIDE ? open.find(t=>t.dedup_key===FOCUS_OVERRIDE) : null;
    if(!focus) focus = open[0];
    const pos = focus ? open.indexOf(focus)+1 : 0;
    const upNext = open.filter(t=>t!==focus);

    let html='';
    // Progress bar
    html += `<div class="dn-q-bar">
        <span>✅ <b>${extraDone.length}</b> done</span>
        <span>🔬 <b>${measuring.length}</b> measuring</span>
        <span>🎯 <b>${open.length}</b> to do</span>
        <span style="margin-left:auto;font-size:12px;">Ordered by sales impact — do the top one, hit DONE, the next loads.</span>
    </div>`;

    if(focus){
        html += activeCard(focus, pos, open.length);
    } else if(open.length===0 && measuring.length){
        html += `<div class="dn-guide" style="border-color:#16a34a;"><div class="dn-guide-title">🎉 Nothing to do right now.</div>
            <p style="margin:6px 0 0;color:var(--text-muted);">Everything you've started is in measurement below. Come back after the auto-checks, or run a fresh evaluation.</p></div>`;
    }

    // Up next — muted, reachable (soft focus, not a lock)
    if(upNext.length){
        html += `<div class="dn-qsection" onclick="dnTgl(this)">▸ ⏭ Up next (${upNext.length}) — click any to jump</div><div style="display:none;">`;
        html += upNext.slice(0,25).map(t=>`<div class="dn-mini" style="cursor:pointer;" onclick="dnFocus('${esc(t.dedup_key)}')">
            <span>${(CAT_META[t.category]||{icon:'•'}).icon} ${esc(t.title)}</span>
            <span class="r">${t.expected_value>0?'$'+Math.round(t.expected_value)+'/mo':(t.reach?(t.reach).toLocaleString()+' impr':'')}</span></div>`).join('');
        if(upNext.length>25) html += `<p style="font-size:12px;color:var(--text-muted);">…and ${upNext.length-25} more.</p>`;
        html += `</div>`;
    }
    // Measuring
    if(measuring.length){
        html += `<div class="dn-qsection" onclick="dnTgl(this)">▸ 🔬 Measuring (${measuring.length}) — auto-checking</div><div style="display:none;">`;
        html += measuring.map(t=>`<div class="dn-mini lock"><span>${(CAT_META[t.category]||{icon:'•'}).icon} ${esc(t.title)}</span>
            <span class="r">${t.review_date?('checks '+esc(t.review_date)):'in progress'}</span></div>`).join('');
        html += `</div>`;
    }
    // Skipped
    if(skipped.length){
        html += `<div class="dn-qsection" onclick="dnTgl(this)">▸ ⏸ Skipped (${skipped.length})</div><div style="display:none;">`;
        html += skipped.map(t=>`<div class="dn-mini"><span>${(CAT_META[t.category]||{icon:'•'}).icon} ${esc(t.title)}</span>
            <button class="pb-task-btn pb-task-btn-alt" onclick="dnUnskip('${esc(t.dedup_key)}')">Put back</button></div>`).join('');
        html += `</div>`;
    }
    // Done
    if(extraDone.length){
        html += `<div class="dn-qsection" onclick="dnTgl(this)">▸ ✅ Done (${extraDone.length})</div><div style="display:none;">`;
        html += extraDone.map(t=>`<div class="dn-mini"><span>✓ ${esc(t.title)}</span><span class="r">${esc((STATUS_META[t.status]||{txt:''}).txt)}</span></div>`).join('');
        html += `</div>`;
    }
    body.innerHTML=html;

    // Auto-load the paste-ready deliverable for the focus task (once, cached).
    if(focus && DN_AUTODELIV.has((focus.category||'').toLowerCase())){
        dnAutoDeliv(focus);
    }
    lpAnnotate();
}

function activeCard(t, pos, total){
    const c=CAT_META[t.category]||{icon:'•',label:t.category};
    const steps=dnSteps(t);
    const done=Math.min(dnStepDoneCount(t.dedup_key), steps.length);
    const cat=(t.category||'').toLowerCase();
    const where=DN_WHERE[cat]||'Follow the steps below on the page itself, then save.';
    const allDone = done>=steps.length;
    const stepsHtml = steps.map((s,i)=>{
        const isCode=/^\s*[\[{<]/.test(s);
        const body=isCode?`<pre class="dn-code" style="margin:4px 0 0;">${esc(s)}</pre>`:`<span class="dn-stxt">${esc(s)}</span>`;
        if(i<done)  return `<li class="dn-s-done">${body}</li>`;
        if(i===done)return `<li class="dn-s-now">${body}<br><button class="dn-step-done" onclick="dnStepDo('${esc(t.dedup_key)}',${steps.length})">Did it ✓</button></li>`;
        return `<li class="dn-s-lock">${body}</li>`;
    }).join('');
    // Content tasks: a prominent "write it for me" that fills the deliverable box.
    const domId='dv-'+dnKeyId(t.dedup_key);
    const writeBtn = cat==='content'
        ? `<button class="pb-task-btn" onclick="dnGenerate('${esc(t.dedup_key)}','${domId}',this)">✍️ Write the full article for me (2–4 min)</button>` : '';
    const cached = DN_DELIV[t.dedup_key];
    const delivHtml = cached!==undefined ? cached
        : (DN_AUTODELIV.has(cat) ? '<p class="pb-loading" style="margin:6px 0;">Writing your paste-ready text…</p>' : '');
    return `<div class="dn-guide">
        <div class="dn-guide-top"><span class="dn-now">NOW</span>
            <span class="dn-pos">#${pos} of ${total}</span>${tierLabel(t)}
            ${t.low_hanging?'<span class="dn-payoff" style="background:#dbeafe;color:#1e40af;">🍒 quick & easy</span>':''}</div>
        <div class="dn-guide-title">${c.icon} ${esc(t.title)}</div>
        <div class="dn-guide-meta">${payoffChip(t)}
            ${t.url?`<a href="${esc(t.url)}" target="_blank">${esc(fmtPath(t.url))}</a><span class="lp-slot" data-lp-url="${esc(t.url)}"></span>`:''}
            <span style="color:var(--text-muted);">· effort: ${esc((t.effort||'').split(' ')[0]||'—')} · results in ${esc(t.time_to_impact_label||'—')}</span>
        </div>
        <div class="dn-where">📍 <b>Where:</b> ${where}</div>
        <ol class="dn-steps2">${stepsHtml||'<li class="dn-s-now">Do the change on the page, then hit DONE.</li>'}</ol>
        ${writeBtn}
        <div class="dn-deliv" id="${domId}">${delivHtml}</div>
        <div class="dn-guide-actions">
            <button class="dn-done-big" ${allDone?'':'disabled'} onclick="dnFinish('${esc(t.dedup_key)}',this)">
                ${allDone?'✅ DONE — start measuring &amp; load next':'Finish the steps above to enable DONE'}</button>
            <button class="dn-skip" onclick="dnSkip('${esc(t.dedup_key)}')">Skip for now</button>
        </div>
    </div>`;
}

function dnTgl(el){ const n=el.nextElementSibling; const open=n.style.display!=='none'; n.style.display=open?'none':'block'; el.textContent=el.textContent.replace(open?'▾':'▸', open?'▸':'▾'); }
function dnFocus(key){ FOCUS_OVERRIDE=key; renderPlan(DN.plan||[], DN.adopted_extra||[]); window.scrollTo({top:0,behavior:'smooth'}); }
function dnStepDo(key, n){ const cur=dnStepDoneCount(key); dnSetLS('dnstep:'+key, Math.min(cur+1,n)); renderPlan(DN.plan||[], DN.adopted_extra||[]); }
function dnSkip(key){ const s=dnSkipSet(); s.add(key); dnSkipSave(s); if(FOCUS_OVERRIDE===key) FOCUS_OVERRIDE=null; renderPlan(DN.plan||[], DN.adopted_extra||[]); dnToast('Skipped — moved to the Skipped list'); }
function dnUnskip(key){ const s=dnSkipSet(); s.delete(key); dnSkipSave(s); renderPlan(DN.plan||[], DN.adopted_extra||[]); }
async function dnFinish(key, btn){
    if(btn){ btn.disabled=true; btn.textContent='Starting measurement…'; }
    const t=(DN.plan||[]).find(x=>x.dedup_key===key);
    DN_ADOPTED_LOCAL.add(key);                    // optimistic: next task loads instantly
    if(FOCUS_OVERRIDE===key) FOCUS_OVERRIDE=null;
    try{ localStorage.removeItem('dnstep:'+key); }catch(e){}
    renderPlan(DN.plan||[], DN.adopted_extra||[]);
    window.scrollTo({top:0,behavior:'smooth'});
    dnToast('✅ Done — now measuring. Next one’s up.');
    try{ await fetch('/api/action-plan/adopt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(t||{dedup_key:key})}); }
    catch(e){ dnToast('Saved locally but the server didn’t confirm — it’ll retry on refresh',true); }
}
async function dnAutoDeliv(t){
    const key=t.dedup_key;
    if(DN_DELIV[key]!==undefined) return;         // already have it
    const box=document.getElementById('dv-'+dnKeyId(key)); if(!box) return;
    try{
        const res=await fetch('/api/action-plan/deliverable',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(t)});
        const data=await res.json();
        let html='';
        if((data.blocks||[]).length){
            html = `<div style="font-size:12px;color:#166534;font-weight:600;margin-bottom:4px;">✅ Paste-ready — copy straight into Magento:</div>` + data.blocks.map(b=>`
                <div class="dn-dv-block"><div class="dn-dv-label">${esc(b.label||'')}</div>
                <div class="dn-dv-row"><div class="dn-dv-text">${esc(b.text||'')}</div>
                <button class="dn-copy-btn" onclick="dnCopy(this)">Copy</button></div></div>`).join('');
        }
        DN_DELIV[key]=html;
        const b2=document.getElementById('dv-'+dnKeyId(key)); if(b2) b2.innerHTML=html;
    }catch(e){ DN_DELIV[key]=''; const b2=document.getElementById('dv-'+dnKeyId(key)); if(b2) b2.innerHTML=''; }
}

function dnCopy(btn){
    const box=btn.parentElement.querySelector('.dn-dv-text');
    if(!box) return;
    const text=box.textContent;
    const done=()=>{ const o=btn.textContent; btn.textContent='✓ Copied'; setTimeout(()=>btn.textContent=o,1500); };
    // navigator.clipboard only exists in a secure context (HTTPS/localhost). The
    // tool is served over plain HTTP, so fall back to execCommand there.
    if(navigator.clipboard && window.isSecureContext){
        navigator.clipboard.writeText(text).then(done).catch(()=>dnFallbackCopy(text,done));
    } else { dnFallbackCopy(text,done); }
}
function dnFallbackCopy(text,done){
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.cssText='position:fixed;left:-9999px';
    document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    ok?done():dnToast('Copy failed — select the text and copy manually',true);
}

async function dnGenerate(key, domId, btn){
    const t=[...(DN.plan||[]),...(DN.adopted_extra||[])].find(x=>x.dedup_key===key); if(!t) return;
    const box=document.getElementById(domId);
    if(btn) btn.disabled=true;
    // Content tasks: write the FULL article using the same 12-phase generator as
    // the Content page — so "Write it for me" means the same thing everywhere,
    // not a lightweight brief here and a full draft there.
    if((t.category||'').toLowerCase()==='content'){ return dnGenerateArticle(t, box, btn); }
    box.innerHTML='<p class="pb-loading" style="margin:8px 0;">Writing it, grounded in your page…</p>';
    try{
        const res=await fetch('/api/action-plan/deliverable',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(t)});
        const data=await res.json();
        if(btn) btn.disabled=false;
        if(data.error){ box.innerHTML=`<p class="empty-state" style="text-align:left;">${esc(data.error)}</p>`; return; }
        if(!(data.blocks||[]).length){ box.innerHTML=`<p class="dn-note">${esc(data.note||'Nothing to generate for this task.')}</p>`; return; }
        box.innerHTML = data.blocks.map(b=>`
            <div class="dn-dv-block">
                <div class="dn-dv-label">${esc(b.label||'')}</div>
                <div class="dn-dv-row"><div class="dn-dv-text">${esc(b.text||'')}</div>
                <button class="dn-copy-btn" onclick="dnCopy(this)">Copy</button></div>
            </div>`).join('');
    }catch(e){ if(btn) btn.disabled=false; box.innerHTML=`<p class="empty-state">Failed: ${esc(e.message)}</p>`; }
}

// Stream the full article for a content task via the same generator the Content
// page uses (12-phase framework, latent-demand facets). Renders the draft as it
// streams; adds a Copy button when done.
async function dnGenerateArticle(t, box, btn){
    const topic=(t.metric && t.metric.query) || t.query || '';
    if(!topic){ box.innerHTML='<p class="empty-state" style="text-align:left;">No topic on this task to write from.</p>'; if(btn) btn.disabled=false; return; }
    box.innerHTML='<p class="pb-loading" style="margin:8px 0;">Writing the full article — this takes 2–4 minutes…</p>';
    let content='';
    try{
        const resp=await fetch('/api/content/generate-article',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:topic})});
        if(!resp.ok){ const j=await resp.json().catch(()=>({})); box.innerHTML=`<p class="empty-state" style="text-align:left;">${esc(j.error||('HTTP '+resp.status))}</p>`; if(btn) btn.disabled=false; return; }
        const reader=resp.body.getReader(); const dec=new TextDecoder(); let buf='';
        while(true){
            const {done,value}=await reader.read();
            if(done) break;
            buf+=dec.decode(value,{stream:true});
            const lines=buf.split('\n'); buf=lines.pop();
            for(const line of lines){
                if(!line.startsWith('data: ')) continue;
                try{ const evt=JSON.parse(line.slice(6));
                    if(evt.error){ box.innerHTML=`<p class="empty-state" style="text-align:left;">${esc(evt.error)}</p>`; if(btn) btn.disabled=false; return; }
                    if(evt.text){ content+=evt.text; box.innerHTML=`<pre class="dn-article" style="white-space:pre-wrap;max-height:360px;overflow:auto;font-size:12.5px;line-height:1.5;">${esc(content)}</pre>`; box.querySelector('pre').scrollTop=1e9; }
                }catch(e){}
            }
        }
        // Styled headings (esp. the large hero h2) often omit line-height, so a
        // wrapped title overlaps — inject a safe line-height where missing before
        // the operator copies the HTML.
        content=content.replace(/<(h[1-4])\b([^>]*?)style="([^"]*)"/gi, (m,tag,pre,style)=>
            /line-height/i.test(style)?m:`<${tag}${pre}style="${style}${style.trim().endsWith(';')?'':';'}line-height:1.3"`);
        box.innerHTML=`<div class="dn-dv-block"><div class="dn-dv-label">Full article draft</div><div class="dn-dv-row" style="align-items:flex-start;"><pre class="dn-dv-text dn-article" style="white-space:pre-wrap;max-height:420px;overflow:auto;font-size:12.5px;line-height:1.5;">${esc(content||'(empty)')}</pre><button class="dn-copy-btn" onclick="dnCopy(this)">Copy</button></div></div>`;
    }catch(e){ box.innerHTML=`<p class="empty-state" style="text-align:left;">Failed: ${esc(e.message)}</p>`; }
    if(btn) btn.disabled=false;
}

async function dnAdoptBatch(cat, btn){
    const items=(DN.plan||[]).filter(t=>!t.adopted && t.category===cat);
    if(btn){ btn.disabled=true; btn.textContent='Starting…'; }
    let ok=0;
    for(const t of items){
        try{
            const res=await fetch('/api/action-plan/adopt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(t)});
            if((await res.json()).success) ok++;
        }catch(e){}
    }
    dnToast(`Started ${ok} task(s)`); loadPlan();
}

async function dnAdopt(key, btn){
    const t=(DN.plan||[]).find(x=>x.dedup_key===key); if(!t) return;
    if(btn){ btn.disabled=true; btn.textContent='Starting…'; }
    try{
        const res=await fetch('/api/action-plan/adopt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(t)});
        const data=await res.json();
        if(data.success){ dnToast('Started — moved to “In progress” at the top. Auto-check set for '+data.review_date); loadPlan(); }
        else { if(btn){btn.disabled=false;btn.textContent='Start this →';} dnToast(data.error||'Failed',true); }
    }catch(e){ if(btn){btn.disabled=false;btn.textContent='Start this →';} dnToast('Failed: '+e.message,true); }
}

async function dnComplete(key, btn){
    if(btn){ btn.disabled=true; btn.textContent='…'; }
    try{
        const res=await fetch('/api/action-plan/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dedup_key:key})});
        const data=await res.json();
        if(data.success){ dnToast('Marked done'); loadPlan(); }
        else { if(btn){btn.disabled=false;btn.textContent='Mark done';} dnToast(data.error||'Failed',true); }
    }catch(e){ if(btn){btn.disabled=false;btn.textContent='Mark done';} dnToast('Failed: '+e.message,true); }
}

// ── 🔗 Link-prospect chips: shown on any task whose page the prospect engine
// has ranked targets for (i.e. pages diagnosed as authority-constrained).
let LP_SUMMARY = null;
async function lpLoadSummary(){
    try{ const r = await fetch('/api/link-prospects/summary'); LP_SUMMARY = await r.json(); lpAnnotate(); }catch(e){}
}
function lpAnnotate(){
    if(!LP_SUMMARY || !LP_SUMMARY.by_url) return;
    document.querySelectorAll('.lp-slot[data-lp-url]').forEach(el=>{
        const info = LP_SUMMARY.by_url[el.dataset.lpUrl];
        if(!info){ el.innerHTML=''; return; }
        el.innerHTML = ` <a href="/playbook?links_for=${encodeURIComponent(el.dataset.lpUrl)}"
            style="font-size:11px;font-weight:600;color:#d97706;text-decoration:none;border:1px solid #fbbf24;border-radius:10px;padding:1px 7px;margin-left:6px;white-space:nowrap;"
            title="Link prospects ready: ${esc(info.top.join(', '))} — open the ranked list with evidence and outreach drafts">🔗 ${info.count} link prospect${info.count>1?'s':''}</a>`;
    });
}

loadPlan();
lpLoadSummary();
</script>
