<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Sign in — Governor</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center;
               justify-content: center; background: #0f172a;
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .card { background: #fff; border-radius: 14px; padding: 34px 30px;
                width: 340px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
        .brand { font-size: 22px; font-weight: 800; color: #0f172a; }
        .sub { font-size: 13px; color: #64748b; margin: 2px 0 22px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #334155;
                margin: 14px 0 5px; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1;
                border-radius: 8px; font-size: 14px; }
        input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
        button { width: 100%; margin-top: 20px; padding: 11px; border: none;
                 border-radius: 8px; background: #2563eb; color: #fff; font-size: 14px;
                 font-weight: 700; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .err { margin-top: 14px; font-size: 13px; color: #b91c1c; background: #fef2f2;
               border: 1px solid #fecaca; border-radius: 8px; padding: 8px 10px; }
    </style>
</head>
<body>
    <form class="card" method="POST" action="{{ url_for('login', next=request.args.get('next','/')) }}">
        <div class="brand">Governor</div>
        <div class="sub">Organic Growth — sign in to continue</div>
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" autofocus required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
        {% if error %}<div class="err">{{ error }}</div>{% endif %}
    </form>
</body>
</html>
